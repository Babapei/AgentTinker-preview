[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agenttinker"
version = "0.0.1"
description = "An interactive lab for observing, debugging, and evaluating AI agents."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.0,<2",
    "pydantic>=2,<3",
]

[project.scripts]
agenttinker-m0 = "agenttinker.m0.cli:main"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.14,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agenttinker"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
